<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; text-align: center; font-family: sans-serif; }
    .video-container { position: relative; width: 300px; height: 225px; margin: auto; background: #000; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    button { margin: 10px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>MoveNet Live</h3>
  <div class="video-container">
    <video id="popup-video" autoplay playsinline muted></video>
    <canvas id="popup-canvas"></canvas>
  </div>
  <button id="toggle-btn">Start MoveNet</button>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
